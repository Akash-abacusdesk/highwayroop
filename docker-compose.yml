# Local:      `docker compose up -d --build` with no .env -> http://localhost:3000
# Production: /srv/sites/highwayroop.com/.env sets WEB_BIND=127.0.0.1
#             WEB_PORT=8169 behind host nginx (TLS terminated there).
name: highway-roop

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: highway-roop-web:latest
    container_name: highway-roop-web
    restart: unless-stopped
    ports:
      - "${WEB_BIND:-0.0.0.0}:${WEB_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
